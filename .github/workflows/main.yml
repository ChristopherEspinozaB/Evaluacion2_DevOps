name: CI/CD — Calidad, Seguridad, Imagen y Despliegue

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────── 1. Tests, cobertura, SonarCloud y Snyk ───────────────
  test-quality:
    name: Tests, cobertura y calidad
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Tests + cobertura mínima (JaCoCo)
        run: mvn -B verify

      - name: Subir reporte JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/

      - name: SonarCloud (bloquea si falla el Quality Gate)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.qualityGate.wait=true
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

      - name: Instalar Snyk CLI
        run: npm install -g snyk@latest

      - name: Dar permisos al Maven Wrapper
        run: chmod +x backend/mvnw


      - name: Snyk dependencias
        uses: snyk/actions/maven@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=backend/pom.xml --org=84f62d21-f0bd-460a-aff6-eff80a88eb01 --severity-threshold=high


  # ─────────────── 2. Imagen: build, escaneo y push ───────────────
  build-scan-push:
    name: Build, escaneo y push de imagen
    needs: test-quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build de la imagen para escanear
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: supletanes-app:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Snyk imagen Docker (bloquea con severidad High o Critical)
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: supletanes-app:scan
          args: --severity-threshold=high --file=backend/Dockerfile

      - name: Login en DockerHub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push de la imagen (tag SHA + latest)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/supletanes-app:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/supletanes-app:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha

  # ─────────────── 3. Despliegue automático en entorno simulado ───────────────
  deploy:
    name: Despliegue en staging (Compose)
    needs: build-scan-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    defaults:
      run:
        working-directory: backend
    env:
      APP_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/supletanes-app:${{ github.sha }}
      PGPASSWORD: ${{ secrets.DB_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login en DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Levantar el stack (espera healthchecks)
        run: |
          docker compose pull app
          docker compose up -d --wait

      - name: Smoke tests contra el balanceador
        run: |
          curl -fsS http://localhost:8080/actuator/health
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8080/api/productos \
            -H "Content-Type: application/json" \
            -d '{"nombre":"Whey","descripcion":"Proteina","precio":25000,"stock":10,"categoria":"Proteinas"}')
          [ "$code" = "201" ]
          curl -fsS http://localhost:8080/api/productos | grep -q "Whey"
          curl -fsS http://localhost:8080/api/productos/categoria/Proteinas | grep -q "Whey"

      - name: Logs si falla
        if: failure()
        run: docker compose logs --tail=100

      - name: Resumen de trazabilidad
        if: always()
        run: |
          {
            echo "### Despliegue en staging"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Imagen: \`${{ env.APP_IMAGE }}\`"
            echo "- Autor: ${{ github.actor }}"
            echo "- Ejecución: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apagar el entorno
        if: always()
        run: docker compose down -v

  # ─────────────── 4. Alerta si falla calidad o seguridad ───────────────
  notify-failure:
    name: Alerta de fallo
    needs: [test-quality, build-scan-push, deploy]
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Crear issue de alerta
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Pipeline fallido en ${context.sha.substring(0, 7)}`,
              body: `El pipeline falló (calidad, seguridad o despliegue). Revisar: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });