
name: CI/CD — Calidad, Seguridad, Imagen y Despliegue

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      modo_prueba:
        description: "Selecciona la ejecución normal de pruebas o el error controlado"
        required: true
        type: choice
        options:
          - normal
          - error
        default: normal

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================
  # 1. PRUEBAS, COBERTURA Y SONARCLOUD
  # ==========================================================
  test-quality:
    name: Pruebas, cobertura y calidad
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Dar permisos al wrapper de Maven
        run: chmod +x mvnw

      - name: Ejecutar pruebas y generar cobertura
        run: ./mvnw -B clean verify

      - name: Publicar reporte JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-jacoco
          path: backend/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 7

      - name: Analizar código con SonarCloud
        if: success() && github.event_name == 'push'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -Eeuo pipefail

          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "ERROR: falta configurar el secreto SONAR_TOKEN."
            exit 1
          fi

          ./mvnw -B \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.qualityGate.wait=true \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.token="$SONAR_TOKEN"

  # ==========================================================
  # 2. CONSTRUIR, ESCANEAR Y PUBLICAR IMAGEN DOCKER
  # ==========================================================
  build-scan-push:
    name: Construir y publicar imagen Docker
    runs-on: ubuntu-latest
    needs:
      - test-quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read

    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/supletanes-app:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/supletanes-app:latest

  # ==========================================================
  # 3. DESPLIEGUE Y VERIFICACIÓN CON DOCKER COMPOSE
  # ==========================================================
  deploy:
    name: Despliegue y pruebas de integración
    runs-on: ubuntu-latest
    needs:
      - test-quality
      - build-scan-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: staging

    defaults:
      run:
        working-directory: backend

    env:
      APP_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/supletanes-app:${{ github.sha }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Validar secretos necesarios
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -Eeuo pipefail

          if [ -z "${DOCKERHUB_USERNAME:-}" ]; then
            echo "ERROR: falta configurar DOCKERHUB_USERNAME."
            exit 1
          fi

          if [ -z "${DB_PASSWORD:-}" ]; then
            echo "ERROR: falta configurar DB_PASSWORD."
            exit 1
          fi

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Validar configuración de Docker Compose
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "========== VALIDAR CONFIGURACIÓN =========="

          if [ ! -f docker-compose.yml ]; then
            echo "ERROR: no se encontró backend/docker-compose.yml."
            exit 1
          fi

          docker compose config -q

      - name: Iniciar PostgreSQL y comprobar conexión
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "========== INICIAR POSTGRESQL =========="

          docker compose up -d postgres

          for intento in $(seq 1 30); do
            if docker compose exec -T postgres sh -c \
              'pg_isready -U "${POSTGRES_USER:-supletanes_user}" -d "${POSTGRES_DB:-supletanes_db}"' \
              >/dev/null 2>&1; then
              echo "OK: PostgreSQL acepta conexiones."
              break
            fi

            if [ "$intento" -eq 30 ]; then
              echo "ERROR: PostgreSQL no estuvo disponible a tiempo."
              docker compose ps -a
              docker compose logs --tail=150 postgres
              exit 1
            fi

            echo "Intento $intento de 30: PostgreSQL todavía no está listo."
            sleep 2
          done

      - name: Descargar e iniciar la aplicación
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "========== INICIAR APLICACIÓN =========="

          docker compose pull app
          docker compose up -d --no-deps app

          echo "========== ESTADO INICIAL =========="
          docker compose ps -a

      - name: Verificar Spring Boot en cada contenedor
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "========== VERIFICAR SPRING BOOT =========="

          intentos_maximos=3
          intento=1
          aplicacion_lista=false

          while [ "$intento" -le "$intentos_maximos" ]; do
            contenedores="$(docker compose ps -q app)"

            if [ -z "$contenedores" ]; then
              echo "ERROR: no existen contenedores de la aplicación."
              docker compose ps -a
              docker compose logs --tail=200 app
              exit 1
            fi

            todos_listos=true

            while IFS= read -r contenedor; do
              [ -n "$contenedor" ] || continue

              if ! docker exec "$contenedor" sh -c \
                'wget -qO- http://127.0.0.1:8080/actuator/health' \
                >/dev/null 2>&1; then
                todos_listos=false
                break
              fi
            done <<< "$contenedores"

            if [ "$todos_listos" = true ]; then
              aplicacion_lista=true
              echo "OK: Spring Boot responde en todos los contenedores."
              break
            fi

            echo "Intento $intento de $intentos_maximos: Spring Boot todavía no responde."
            sleep 5
            intento=$((intento + 1))
          done

          if [ "$aplicacion_lista" != true ]; then
            echo "ERROR: Spring Boot no respondió después de 3 intentos."
            echo "========== ESTADO DE LOS CONTENEDORES =========="
            docker compose ps -a
            echo "========== LOGS DE LA APLICACIÓN =========="
            docker compose logs --tail=200 app
            echo "========== LOGS DE POSTGRESQL =========="
            docker compose logs --tail=100 postgres
            exit 1
          fi

      - name: Diagnosticar estado y salud de los servicios
        if: always()
        shell: bash
        run: |
          echo "========== ESTADO DE LOS CONTENEDORES =========="
          docker compose ps -a || true

          echo "========== SALUD DE LOS CONTENEDORES =========="
          for contenedor in $(docker compose ps -q app 2>/dev/null); do
            docker inspect \
              --format='Contenedor={{.Name}} Estado={{.State.Status}} Salud={{if .State.Health}}{{.State.Health.Status}}{{else}}sin healthcheck{{end}}' \
              "$contenedor" || true
          done

          echo "========== LOGS DE SPRING BOOT =========="
          docker compose logs --tail=100 app || true

          echo "========== LOGS DE POSTGRESQL =========="
          docker compose logs --tail=100 postgres || true

      - name: Resumen de trazabilidad
        if: always()
        shell: bash
        env:
          RESULTADO: ${{ job.status }}
        run: |
          {
            echo "## Resumen del despliegue"
            echo ""
            echo "- **Resultado del trabajo:** ${RESULTADO}"
            echo "- **Rama:** ${GITHUB_REF_NAME}"
            echo "- **Commit:** ${GITHUB_SHA}"
            echo "- **Imagen:** ${APP_IMAGE}"
            echo "- **Ejecución:** ${GITHUB_RUN_ID}"
            echo ""
            echo "### Contenedores"
            docker compose ps -a || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apagar el entorno de pruebas
        if: always()
        shell: bash
        run: |
          echo "========== APAGAR EL ENTORNO =========="
          docker compose down -v --remove-orphans || true

  # ==========================================================
  # 4. CASO DE ERROR CONTROLADO Y REGISTRO
  # ==========================================================
  test-controlled-failure:
    name: Prueba de error controlado y logging
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.modo_prueba == 'error'

    permissions:
      contents: read

    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Preparar registro de prueba
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p logs
          {
            echo "INICIO: prueba de error controlado"
            echo "EJECUCION=${GITHUB_RUN_ID}"
            echo "COMMIT=${GITHUB_SHA}"
            echo "RAMA=${GITHUB_REF_NAME}"
          } | tee logs/error-controlado.log

      - name: Provocar error controlado
        id: prueba
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail

          codigo_error="TEST_CONTROLLED_FAILURE"
          causa="Fallo intencional para validar el registro de errores"

          {
            echo "ESTADO=ERROR"
            echo "CODIGO=${codigo_error}"
            echo "CAUSA=${causa}"
            echo "PASO=Provocar error controlado"
          } | tee -a logs/error-controlado.log

          echo "::error title=${codigo_error}::${causa}"
          exit 1

      - name: Confirmar que el error fue detectado
        if: always()
        shell: bash
        env:
          RESULTADO_PRUEBA: ${{ steps.prueba.outcome }}
        run: |
          set -Eeuo pipefail

          if [ "$RESULTADO_PRUEBA" = "failure" ]; then
            echo "OK: se detectó el error controlado."
            echo "Código: TEST_CONTROLLED_FAILURE"
            echo "El registro se publicará como artefacto."
          else
            echo "ERROR: no se detectó el fallo esperado."
            exit 1
          fi

      - name: Publicar registro del error controlado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: error-controlado-log
          path: logs/error-controlado.log
          if-no-files-found: error
          retention-days: 7

      - name: Finalizar prueba con fallo intencional
        if: always()
        shell: bash
        run: |
          echo "ERROR: fallo controlado solicitado para demostrar el manejo de errores."
          exit 1

  # ==========================================================
  # 5. NOTIFICAR FALLOS MEDIANTE UNA ISSUE DE GITHUB
  # ==========================================================
  notify-failure:
    name: Notificar fallo del pipeline
    runs-on: ubuntu-latest
    needs:
      - test-quality
      - build-scan-push
      - deploy
      - test-controlled-failure

    if: >-
      always() &&
      (
        (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          (
            needs.test-quality.result == 'failure' ||
            needs.build-scan-push.result == 'failure' ||
            needs.deploy.result == 'failure'
          )
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.modo_prueba == 'error' &&
          needs.test-controlled-failure.result == 'failure'
        )
      )

    permissions:
      contents: read
      issues: write

    steps:
      - name: Crear issue con el fallo
        uses: actions/github-script@v7
        env:
          TEST_QUALITY_RESULT: ${{ needs.test-quality.result }}
          BUILD_RESULT: ${{ needs.build-scan-push.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          CONTROLLED_FAILURE_RESULT: ${{ needs.test-controlled-failure.result }}
          MODO_PRUEBA: ${{ inputs.modo_prueba }}
        with:
          script: |
            const titulo = `CI/CD fallido: ${context.workflow} #${context.runNumber}`;

            const cuerpo = [
              "## Fallo del pipeline CI/CD",
              "",
              `- **Repositorio:** ${context.repo.owner}/${context.repo.repo}`,
              `- **Rama:** ${context.ref}`,
              `- **Commit:** ${context.sha}`,
              `- **Ejecución:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- **Modo de prueba:** ${process.env.MODO_PRUEBA || "push normal"}`,
              "",
              "### Resultado de los trabajos",
              `- test-quality: ${process.env.TEST_QUALITY_RESULT}`,
              `- build-scan-push: ${process.env.BUILD_RESULT}`,
              `- deploy: ${process.env.DEPLOY_RESULT}`,
              `- test-controlled-failure: ${process.env.CONTROLLED_FAILURE_RESULT}`,
              "",
              "Consulta los registros de la ejecución y descarga los artefactos disponibles para identificar la causa."
            ].join("\n");

            const existente = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });

            const yaExiste = existente.data.some(
              issue => issue.title === titulo
            );

            if (!yaExiste) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: titulo,
                body: cuerpo
              });

              core.info("OK: se creó una issue para documentar el fallo.");
            } else {
              core.info("OK: ya existe una issue para esta ejecución.");
            }
