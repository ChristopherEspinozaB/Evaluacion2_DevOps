
name: CI/CD — Calidad, Imagen y Despliegue

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────── 1. Tests, cobertura y SonarCloud ───────────────
  test-quality:
    name: Tests, cobertura y calidad
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Tests + cobertura mínima (JaCoCo)
        run: mvn -B verify

      - name: Subir reporte JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 7

      - name: SonarCloud (bloquea si falla el Quality Gate)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.qualityGate.wait=true
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
          -Dsonar.token="$SONAR_TOKEN"

  # ─────────────── 2. Imagen: build y push ───────────────
  build-scan-push:
    name: Build y publicación de imagen
    needs: test-quality
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build de la imagen Docker
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: supletanes-app:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Login en DockerHub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push de la imagen (tag SHA + latest)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/supletanes-app:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/supletanes-app:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha

  # ─────────────── 3. Despliegue automático en staging ───────────────
  deploy:
    name: Despliegue en staging (Compose)
    needs: build-scan-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging

    defaults:
      run:
        working-directory: backend

    env:
      APP_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/supletanes-app:${{ github.sha }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar contraseña de PostgreSQL
        shell: bash
        run: |
          if [ -z "$DB_PASSWORD" ]; then
            echo "ERROR: configura el secreto DB_PASSWORD en GitHub."
            exit 1
          fi

          echo "OK: secreto DB_PASSWORD configurado."

      - name: Login en DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Levantar el stack y diagnosticar errores
        shell: bash
        run: |
          set -e

          echo "========== DESCARGANDO IMAGEN =========="
          docker compose pull app

          echo "========== INICIANDO POSTGRES =========="
          docker compose up -d postgres

          echo "========== ESPERANDO A POSTGRES =========="
          postgres_ready=false

          for i in $(seq 1 30); do
            if docker compose exec -T postgres \
              pg_isready -U supletanes_user -d supletanes_db; then
              postgres_ready=true
              break
            fi
            sleep 2
          done

          if [ "$postgres_ready" != "true" ]; then
            echo "ERROR: PostgreSQL no está preparado."
            docker compose logs --no-color --tail=100 postgres
            exit 1
          fi

          echo "OK: PostgreSQL está preparado."

          echo "========== INICIANDO APLICACION =========="
          if ! docker compose up -d --no-deps app; then
            echo "ERROR: no se pudo iniciar la aplicación."
            docker compose ps -a
            docker compose logs --no-color --tail=200 app
            docker compose logs --no-color --tail=100 postgres
            exit 1
          fi

          sleep 10

          echo "========== ESTADO DE CONTENEDORES =========="
          docker compose ps -a

          echo "========== LOGS DE LA APLICACION =========="
          docker compose logs --no-color --tail=200 app

          echo "========== HEALTHCHECK DE LA APLICACION =========="
          for container in $(docker compose ps -aq app); do
            docker inspect "$container" \
              --format='Nombre: {{.Name}} Estado: {{.State.Status}} Salud: {{if .State.Health}}{{.State.Health.Status}}{{else}}sin healthcheck{{end}}'

            docker inspect "$container" \
              --format='{{if .State.Health}}{{range .State.Health.Log}}{{println .Output}}{{end}}{{end}}'
          done

          echo "========== ESTADO DE POSTGRES =========="
          docker compose logs --no-color --tail=100 postgres


      - name: Iniciar Docker y verificar aplicación
        working-directory: backend
        env:
          APP_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/supletanes-app:${{ github.sha }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -Eeuo pipefail

          echo "========== VALIDAR CONFIGURACIÓN =========="
          docker compose config -q

          echo "========== INICIAR POSTGRESQL =========="
          docker compose up -d postgres

          DB_READY=false
          for i in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready \
              -U supletanes_user \
              -d supletanes_db; then
              DB_READY=true
              break
            fi
            sleep 2
          done

          if [ "$DB_READY" != "true" ]; then
            echo "ERROR: PostgreSQL no está disponible."
            docker compose ps -a
            docker compose logs --no-color --tail=150 postgres
            exit 1
          fi

          echo "========== INICIAR APLICACIÓN =========="
          docker compose pull app
          docker compose up -d --no-deps app

          echo "========== ESTADO DE CONTENEDORES =========="
          docker compose ps -a

          echo "========== ESPERAR APLICACIÓN =========="
          APP_READY=false

          for i in $(seq 1 30); do
            if curl --connect-timeout 3 --max-time 10 -fsS \
              http://localhost:8080/actuator/health; then
              echo
              APP_READY=true
              break
            fi

            echo "Intento $i de 30: todavía no responde."
            sleep 5
          done

          if [ "$APP_READY" != "true" ]; then
            echo "ERROR: No hay respuesta en localhost:8080."
            echo "========== CONTENEDORES =========="
            docker compose ps -a
            echo "========== LOGS DE APP =========="
            docker compose logs --no-color --tail=200 app
            echo "========== LOGS DE POSTGRES =========="
            docker compose logs --no-color --tail=100 postgres
            exit 1
          fi

          echo "========== PROBAR CREACIÓN DE PRODUCTO =========="
          code=$(curl --connect-timeout 5 --max-time 20 \
            -sS -o /tmp/producto.json -w "%{http_code}" \
            -X POST http://localhost:8080/api/productos \
            -H "Content-Type: application/json" \
            -d '{"nombre":"Whey","descripcion":"Proteina","precio":25000,"stock":10,"categoria":"Proteinas"}')

          if [ "$code" != "201" ]; then
            echo "ERROR: Se esperaba HTTP 201 y se recibió HTTP $code."
            cat /tmp/producto.json
            exit 1
          fi

          echo "========== PROBAR LISTADO =========="
          curl --connect-timeout 5 --max-time 20 -fsS \
            http://localhost:8080/api/productos > /tmp/productos.json

          if ! grep -q "Whey" /tmp/productos.json; then
            echo "ERROR: El producto no aparece en el listado."
            cat /tmp/productos.json
            exit 1
          fi

          echo "========== PROBAR FILTRO POR CATEGORÍA =========="
          curl --connect-timeout 5 --max-time 20 -fsS \
            http://localhost:8080/api/productos/categoria/Proteinas \
            > /tmp/productos_categoria.json

          if ! grep -q "Whey" /tmp/productos_categoria.json; then
            echo "ERROR: El producto no aparece en el filtro por categoría."
            cat /tmp/productos_categoria.json
            exit 1
          fi

          echo "OK: La aplicación respondió y todas las pruebas finalizaron correctamente."


      - name: Logs si falla
        if: failure()
        run: |
          docker compose ps -a || true
          docker compose logs --no-color --tail=100 || true

      - name: Resumen de trazabilidad
        if: always()
        shell: bash
        run: |
          {
            echo "### Despliegue en staging"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Imagen: \`${APP_IMAGE}\`"
            echo "- Autor: ${{ github.actor }}"
            echo "- Ejecución: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apagar el entorno
        if: always()
        run: docker compose down -v

  # ─────────────── 4. Alerta si falla calidad o despliegue ───────────────
  notify-failure:
    name: Alerta de fallo
    needs: [test-quality, build-scan-push, deploy]
    if: always() && failure() && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      issues: write
      contents: read

    steps:
      - name: Crear issue de alerta
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Pipeline fallido en ${context.sha.substring(0, 7)}`,
              body: `El pipeline falló (calidad o despliegue). Revisar: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
