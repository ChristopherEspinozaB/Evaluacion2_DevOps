
name: CI/CD - Spring Boot y PostgreSQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Pruebas y construcción Docker
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: supletanes_db
          POSTGRES_USER: supletanes_user
          POSTGRES_PASSWORD: supletanes_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supletanes_user -d supletanes_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/supletanes_db
      SPRING_DATASOURCE_USERNAME: supletanes_user
      SPRING_DATASOURCE_PASSWORD: supletanes_pass

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Esperar a PostgreSQL
        shell: bash
        run: |
          for intento in $(seq 1 30); do
            if docker exec "${{ job.services.postgres.id }}" \
              pg_isready -U supletanes_user -d supletanes_db; then
              echo "OK: PostgreSQL está disponible."
              exit 0
            fi
            sleep 2
          done

          echo "ERROR: PostgreSQL no inició."
          exit 1

      - name: Ejecutar pruebas Maven
        working-directory: backend
        run: ./mvnw -B clean verify

      - name: Construir imagen con backend/Dockerfile
        run: docker build -f backend/Dockerfile -t supletanes-app:test ./backend

      - name: Iniciar aplicación
        run: |
          docker run -d \
            --name supletanes-app-test \
            --network host \
            -e PORT=8080 \
            -e SPRING_DATASOURCE_URL="$SPRING_DATASOURCE_URL" \
            -e SPRING_DATASOURCE_USERNAME="$SPRING_DATASOURCE_USERNAME" \
            -e SPRING_DATASOURCE_PASSWORD="$SPRING_DATASOURCE_PASSWORD" \
            supletanes-app:test

      - name: Esperar a que Spring Boot esté disponible
        shell: bash
        run: |
          for intento in $(seq 1 36); do
            if curl --silent --fail \
              http://localhost:8080/actuator/health \
              -o health.json; then
              cat health.json

              if grep -q '"status":"UP"' health.json; then
                echo "OK: Spring Boot está funcionando."
                exit 0
              fi
            fi

            sleep 5
          done

          echo "ERROR: Spring Boot no respondió correctamente."
          docker logs supletanes-app-test
          exit 1

      - name: Mostrar registros si falla
        if: failure()
        run: docker logs supletanes-app-test || true

      - name: Limpiar contenedor
        if: always()
        run: docker rm -f supletanes-app-test || true
