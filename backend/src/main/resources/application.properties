spring.application.name=supletanes_app

server.port=${PORT:8080}
server.forward-headers-strategy=framework


spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:supletanes_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${PGUSER:supletanes_user}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:supletanes_pass}}


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.urls[0].url=https://supletanesappfinal-production.up.railway.app/v3/api-docs
springdoc.swagger-ui.urls[0].name=Railway API

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true