spring.application.name=supletanes_app

# Puerto del servidor (Render usa variable de entorno PORT)
server.port=${PORT:8080}

# Configuración de la base de datos
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:supletanes_db}
spring.datasource.username=${PGUSER:supletanes_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:supletanes_pass}}

# Configuración JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Configurar Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.urls[0].url=https://supletanesappfinal-production.up.railway.app/v3/api-docs
springdoc.swagger-ui.urls[0].name=Railway API

server.forward-headers-strategy=framework

# Health checks para contenedores
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true