services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: supletanes_db
      POSTGRES_USER: supletanes_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Supletanes_DB_2026_Cl4ve!}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  app:
    image: ${APP_IMAGE:-supletanes-app:local}
    build: .
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: supletanes_db
      PGUSER: supletanes_user
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/supletanes_db
      SPRING_DATASOURCE_USERNAME: supletanes_user
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-Supletanes_DB_2026_Cl4ve!}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    networks:
      - backend
      - frontend

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - frontend

networks:
  backend:
  frontend:

volumes:
  pg_data: